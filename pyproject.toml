[build-system]
requires = ["hatchling", "versioningit~=3.1.2"]
build-backend = "hatchling.build"

[project]
dynamic = ["version"]
name = "mytunes"
authors = [
  { name="George Martin Marino", email="gm.engineer+mytunes@pm.me" },
]
description = "A Swiss Army knife for programmatic music library management"
readme = "README.md"
license-files = { paths = ["LICENSE"] }
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Development Status :: 5 - Production/Stable",
    "Natural Language :: English",
    "Intended Audience :: Developers",
]
dependencies = [
    "pydantic[email]~=2.12.5",
    "rich~=14.3.3",
    "mutagen~=1.47.0",
    "aiofiles~=25.1.0",
    "aiorequestful~=1.0.20",
    "python-dateutil~=2.9.0",
    "Pillow~=12.1.1",
    "tabulate[widechars]~=0.10.0",
    "termcolor~=3.3.0",
]

[project.optional-dependencies]
all = [
    "mytunes[musicbee,sqlite]",
]
musicbee = [
    "xmltodict~=1.0.4",
    "lxml~=6.0.2",
]
sqlite = [
    "aiorequestful[sqlite]~=1.0.20",
    "aiosqlite~=0.21.0",  # WORKAROUND: pinned to support Connection.is_alive  # TODO: drop me on aiorequestful v2
]

[dependency-groups]
dev = [
    "flake8",
    "grip",
]
test = [
    "mytunes[all]",
    "pytest~=9.0.2",
    "pytest-asyncio~=1.3.0",
    "pytest-xdist~=3.8.0",
    "pytest-mock~=3.15.1",
    "Faker~=40.4.0",
    "pyyaml~=6.0.3",
]
docs = [
    "sphinx~=8.2.3",
    "sphinx-rtd-theme~=3.1.0",
    "sphinx-autodoc-typehints~=3.5.0",
    "sphinxext-opengraph~=0.13.0",
    "sphinx-new-tab-link~=0.8.1",
    "autodocsumm~=0.2.14",
    "graphviz~=0.21",
    "matplotlib~=3.10.8",
]

[tool.uv]
default-groups = ["dev", "test", "docs"]

[project.urls]
"Documentation" = "https://geo-martino.github.io/mytunes/"
"Release Notes" = "https://geo-martino.github.io/mytunes/info/release-history.html"
"Contribute" = "https://geo-martino.github.io/mytunes/info/contributing.html"
"Source code" = "https://github.com/geo-martino/mytunes"
Issues = "https://github.com/geo-martino/mytunes/issues"

[tool.hatch.version]
source = "versioningit"

[tool.versioningit]
default-version = "0.0.0"

[tool.versioningit.format]
# WORKAROUND: commits for actual production releases keep getting identified as dirty and/or with distance
#  Delete this config when fixed. It should be the commented lines below each (i.e. the default formats)
#distance = "{next_version}.dev{distance}+{vcs}{rev}"
dirty = "{base_version}"
#dirty = "{base_version}+d{build_date:%Y%m%d}"
distance-dirty = "{base_version}"
#distance-dirty = "{next_version}.dev{distance}+{vcs}{rev}.d{build_date:%Y%m%d}"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--color=yes"
markers = [
    "slow: marks test as slow (deselect with '-m \"not slow\"')",
    "manual: marks tests to be run only when manually directed to by the developer",
]
filterwarnings = "ignore::UserWarning"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

#[[tool.mypy.overrides]]
#module = ["tests.*"]
#disable_error_code = ["arg-type"]